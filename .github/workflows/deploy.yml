# Builds the Vite app and publishes it to GitHub Pages on every push to main.
#
# One-time setup in the repository: Settings → Pages → "Build and deployment" →
# Source: "GitHub Actions". No branch or folder needs to be selected.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual re-deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# Grants the workflow the tokens Pages deployment requires.
permissions:
  contents: read
  pages: write
  id-token: write

# If several pushes land quickly, let the in-flight deploy finish and queue the
# newest one rather than cancelling half-way through a publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
